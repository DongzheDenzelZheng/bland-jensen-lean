name: Lean verification

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and audit public theorems
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Lean and build the public module
        uses: leanprover/lean-action@v1
        with:
          build: true
          build-args: BlandJensenFormal.Main
          test: false
          lint: false
          use-mathlib-cache: true

      - name: Run release verification gate
        run: ./scripts/verify.sh
